<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Web Page</title>
    <style>
        /* Basic reset for the body */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Header styling */
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Main content styling */
        main {
            padding: 20px;
        }

        h1 {
            font-size: 36px;
            color: #333;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
        }

        /* Button styling */
        .button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .button:hover {
            background-color: #45a049;
        }

        /* Footer styling */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Stylish Web Page!</h1>
    </header>

    <main>
        <p>This page has some basic styling using CSS. You can edit and customize the styles below!</p>
        <p>Enjoy experimenting with HTML and CSS!</p>
        <a href="#" class="button">Click Me!</a>
        <a href="#" class="button1">Click Me!</a>
         <a href="#" class="button1">Click Me1233!</a>
         <a href="#" class="button1">Click Me1244!</a>
        <a href="#" class="button1">Click Me1255!</a>
    </main>

    <footer>
        <p>© 2026 My Stylish Web Page</p>
    </footer>

</body>
</html>
